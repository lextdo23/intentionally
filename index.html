<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Intentionally">
  <title>Intentionally</title>
  <!-- iPhone and iPad leave a strip at the bottom of a home-screen app that was installed with a manifest, so only
       other phones get one. iPhone uses the apple- tags above and the icon below instead. -->
  <script>
    if (!/iPhone|iPad|iPod/.test(navigator.userAgent) && !(navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
      document.head.append(Object.assign(document.createElement("link"), { rel: "manifest", href: "manifest.webmanifest" }));
    }
  </script>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4" sizes="180x180">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
