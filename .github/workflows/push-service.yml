# Puts the notifications service (push/) on Cloudflare. Runs when push/ changes on main, or by hand from the Actions tab.
# It needs two repository secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see push/README.md); without them it does nothing.
name: Push service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["push/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_TESTER_KEY: ${{ secrets.TESTER_KEY != '' }}
      HAS_RESEND_KEY: ${{ secrets.RESEND_API_KEY != '' }}
    steps:
      # Tools are pinned to exact versions (a fixed fingerprint, version in the comment) so a
      # changed or hijacked release can't slip into a deploy. Update them on purpose, never automatically.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: env.READY == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: push
          wranglerVersion: "3.114.17"
      # The password for the tester page (testers.html). Set it as the repository secret TESTER_KEY.
      - if: env.READY == 'true' && env.HAS_TESTER_KEY == 'true'
        working-directory: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TESTER_KEY: ${{ secrets.TESTER_KEY }}
        run: printf '%s' "$TESTER_KEY" | npx --yes wrangler@3.114.17 secret put TESTER_KEY
      # The key for sending sign-up codes by email (Resend, sending only). Set it as the repository secret RESEND_API_KEY.
      - if: env.READY == 'true' && env.HAS_RESEND_KEY == 'true'
        working-directory: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@3.114.17 secret put RESEND_API_KEY
      - if: env.READY != 'true'
        run: echo "Cloudflare secrets aren't set yet, so nothing was deployed. See push/README.md."
