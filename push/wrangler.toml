# Cloudflare settings for the notifications service. Deployed by .github/workflows/push-service.yml.
name = "intentionally-push"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "PHONES"
class_name = "Phone"

[[durable_objects.bindings]]
name = "KEYS"
class_name = "Keys"

[[durable_objects.bindings]]
name = "TESTERS"
class_name = "Testers"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Phone", "Keys"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Testers"]
