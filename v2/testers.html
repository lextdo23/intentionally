<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://intentionally-push.lextdo.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Daydeck tester page</title>
<style>
/* The private page for reading beta tester data. One calm column: each section is one question, its picture, then "What this means". */
:root{--sky:#24262b;--sky2:#141518;--sky3:#08090a;--ink:#efede9;--dim:rgba(239,237,233,.62);--faint:rgba(239,237,233,.14);
  --sun:#f2c08f;--gold:#e3c486;--warn:#e0a57e;--cool:#a9b9d6;--ok:#a9c4b5;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--sky2) 40%,var(--sky3)) fixed;background-color:var(--sky2);color:var(--ink);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px max(20px,env(safe-area-inset-right)) 64px max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:40px}
h1{font-size:34px;line-height:1.15;margin:0;font-weight:700}
h2{font-size:22px;margin:0;font-weight:600}
p{margin:0}
.sub{color:var(--dim);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:rgba(255,255,255,.05);border-radius:16px;padding:16px}
.tile b{display:block;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--dim)}
@media (max-width:520px){.tile{padding:12px}.tile b{font-size:22px}}  /* keep three across on a phone: less scrolling */
section{display:flex;flex-direction:column;gap:16px}
.ask{font-size:15px;color:var(--dim);margin-top:-8px}
.means{background:rgba(242,192,143,.08);border-radius:12px;padding:12px 16px;font-size:15px}
.means b{color:var(--sun);font-weight:600}
.later{opacity:.55}
.note{font-size:13px;color:var(--dim)}
.gridbox{overflow-x:auto}
.grid{display:grid;gap:3px;font-size:11px;align-items:center}
.grid .lab{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px;padding-right:6px;white-space:nowrap}
.grid .hd{color:var(--dim);text-align:center}
.cell{width:16px;height:16px;border-radius:4px;display:grid;grid-template-rows:1fr 1fr;overflow:hidden;background:var(--faint)}
.cell.none{background:transparent}
.cell .on.a{background:var(--sun)}.cell .on.p{background:var(--cool)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,230px) 1fr 64px;gap:12px;align-items:center;font-size:15px}
.bar .t{height:12px;border-radius:6px;background:var(--faint);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px;background:var(--sun)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
@media (max-width:520px){.bar{grid-template-columns:1fr 56px}.bar .t{grid-column:1/3;grid-row:2}}
.items{display:flex;flex-direction:column;gap:8px}
.item{background:rgba(255,255,255,.05);border-radius:16px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.item .meta{font-size:13px;color:var(--dim)}
.chip{font-size:12px;font-weight:600;border-radius:10px;padding:4px 10px;grid-row:1/3;grid-column:2;white-space:nowrap}
.chip.look{background:rgba(224,165,126,.18);color:var(--warn)}.chip.ok{background:rgba(169,196,181,.16);color:var(--ok)}
.mw{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;font-size:15px;color:var(--dim)}
.stack{display:flex;height:20px;border-radius:6px;overflow:hidden;background:var(--faint)}
.mkey{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--dim)}
.mkey i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{min-height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:var(--ink);font:inherit;padding:0 12px;flex:1 1 200px;min-width:0}
button{min-height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-size:15px;padding:0 16px;cursor:pointer}
button.main{background:var(--sun);color:#1d1e22;font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tbl{overflow-x:auto}
.tcard{background:rgba(255,255,255,.05);border-radius:16px;padding:12px 12px 12px 16px;display:flex;flex-direction:column;gap:8px}
.ttop{display:flex;align-items:center;gap:12px}
.who{flex:1;min-width:0;display:flex;flex-direction:column}.who b{font-weight:600}.who span{font-size:13px;color:var(--dim)}
.confirm{border-top:1px solid var(--faint);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.confirm p{font-size:15px;color:var(--dim)}
.row.two button{flex:1}
button.danger{background:rgba(224,165,126,.2);color:var(--warn);font-weight:600}
table{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--faint);white-space:nowrap}
th{color:var(--dim);font-weight:500}
.foot{border-top:1px solid var(--faint);padding-top:24px}
/* Tabs: one group of sections at a time (alex 2026-11-17). The bar stays at the top while you scroll. */
.ttabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:8px 20px;background:rgba(28,29,33,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{flex:0 0 auto;min-height:44px;border-radius:10px;padding:0 16px;color:var(--dim);background:rgba(255,255,255,.06)}
.ttabs button[aria-selected="true"]{background:var(--ink);color:#1d1e22;font-weight:600}
.needs{background:rgba(224,165,126,.10);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.needs h2{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--warn)}
.needs button{min-height:44px;text-align:left;background:transparent;padding:0;font-size:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.needs button span:last-child{color:var(--dim);font-size:13px;white-space:nowrap}
.needs p{font-size:15px;color:var(--dim)}
/* Card thumbs: every rated card, by pillar, with filters */
.pils{display:flex;flex-direction:column;gap:8px}
.pil{background:rgba(255,255,255,.05);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;min-height:44px;font-size:17px}
.pil[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold) inset}
.ph{display:flex;align-items:center;gap:8px;font-weight:600}
.ph .n{margin-left:auto;font-size:13px;color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--faint)}
.split i{display:block;height:100%}.split .u{background:var(--ok)}.split .d{background:var(--warn)}
.ms{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--faint);padding-top:8px}
.m{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--dim)}
.m b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.m.warn b{color:var(--warn)}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:36px;border-radius:10px;background:transparent;color:var(--dim);padding:0 8px}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--ink);font-weight:600}
select{min-height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-size:15px;padding:0 12px;flex:1 1 160px;min-width:0}
.titem{background:rgba(255,255,255,.05);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.titem .meta{font-size:13px;color:var(--dim)}
.votes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-start}
.v{flex:0 0 auto;white-space:nowrap;font-size:13px;font-weight:600;border-radius:10px;padding:3px 10px;display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.v.up{background:rgba(169,196,181,.16);color:var(--ok)}.v.dn{background:rgba(224,165,126,.18);color:var(--warn)}
.v.who{background:rgba(255,255,255,.06);color:var(--dim);font-weight:500}
.v svg{width:12px;height:12px}.v.dn svg{transform:scaleY(-1)}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1>Tester page</h1>
    <p class="sub" id="status">Private. Enter the tester page password to load what testers have shared.</p>
  </header>
  <form class="row" id="login">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Tester page password" aria-label="Tester page password">
    <button class="main" type="submit">Load</button>
  </form>
  <div id="out" style="display:flex;flex-direction:column;gap:40px"></div>
</div>
<script type="module" src="js/testers-page.js"></script>
</body>
</html>
