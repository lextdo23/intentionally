<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Safety net: only Daydeck's own files and its notification service may run or be reached (see tests/csp.test.cjs). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://intentionally-push.lextdo.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24262b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daydeck">
  <title>Daydeck</title>
  <link rel="manifest" href="manifest.webmanifest">
  <script src="js/standalone.js"></script>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="sun" aria-hidden="true"><i></i></div>
  <main id="home" class="screen"></main>
  <div id="dim" aria-hidden="true"></div>
  <div id="flow"></div>
  <div id="days" role="region" aria-label="Your days"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
